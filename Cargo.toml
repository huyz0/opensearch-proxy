[workspace]
resolver = "2"
members = [
    "crates/osproxy-core",
    "crates/osproxy-spi",
    "crates/osproxy-tenancy",
    "crates/osproxy-transport",
    "crates/osproxy-rewrite",
    "crates/osproxy-sink",
    "crates/osproxy-control",
    "crates/osproxy-observe",
    "crates/osproxy-otlp",
    "crates/osproxy-etcd",
    "crates/osproxy-engine",
    "crates/osproxy-config",
    "crates/osproxy-capture",
    "crates/osproxy-kafka",
    "crates/osproxy-kafka-krafka",
    "crates/osproxy-kafka-wal",
    "crates/osproxy-server",
    "crates/osproxy-bench",
    "xtask",
]
# The rdkafka binding is a standalone crate, deliberately NOT a workspace member:
# it links librdkafka (a heavy native build), so the gate, cargo-deny, fmt, and
# the arch check never touch it. Build it on its own with `cargo build` from its
# directory, on a host with the documented system libraries.
exclude = [
    "crates/osproxy-kafka-rdkafka",
]

[workspace.package]
version = "1.0.4"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Huy Nguyen"]
repository = "https://github.com/huyz0/opensearch-proxy"

[workspace.dependencies]
# Internal crates: `path` drives local builds, `version` is what crates.io records
# for the published dependency (the registry rejects a path-only dep), so the two
# must move together on every release. `osproxy-bench` is intentionally version-less
# below: it is `publish = false` and only a dev-dependency, so its path edge is
# stripped on publish and must not carry a registry version.
osproxy-core = { path = "crates/osproxy-core", version = "1.0.4" }
osproxy-spi = { path = "crates/osproxy-spi", version = "1.0.4" }
osproxy-tenancy = { path = "crates/osproxy-tenancy", version = "1.0.4" }
# default-features off so a consumer can pick the crypto provider feature
# (`non-fips`/`fips`) without the default `non-fips` being force-unioned in.
osproxy-transport = { path = "crates/osproxy-transport", version = "1.0.4", default-features = false }
osproxy-rewrite = { path = "crates/osproxy-rewrite", version = "1.0.4" }
osproxy-sink = { path = "crates/osproxy-sink", version = "1.0.4" }
osproxy-control = { path = "crates/osproxy-control", version = "1.0.4" }
osproxy-observe = { path = "crates/osproxy-observe", version = "1.0.4" }
osproxy-otlp = { path = "crates/osproxy-otlp", version = "1.0.4" }
osproxy-etcd = { path = "crates/osproxy-etcd", version = "1.0.4" }
osproxy-engine = { path = "crates/osproxy-engine", version = "1.0.4" }
osproxy-config = { path = "crates/osproxy-config", version = "1.0.4" }
osproxy-capture = { path = "crates/osproxy-capture", version = "1.0.4" }
osproxy-kafka = { path = "crates/osproxy-kafka", version = "1.0.4" }
# default-features off so the binary picks the crypto provider feature
# (`non-fips`/`fips`) per build; never force-union the default `non-fips`.
osproxy-kafka-krafka = { path = "crates/osproxy-kafka-krafka", version = "1.0.4", default-features = false }
osproxy-kafka-wal = { path = "crates/osproxy-kafka-wal", version = "1.0.4" }
osproxy-bench = { path = "crates/osproxy-bench" }

# Third-party (pinned conservatively; add as milestones need them).
thiserror = "2"
# Lock-free atomic Arc swap for the per-request directive-store read (a hot-path
# `load()`): a relaxed atomic load instead of a mutex, so it scales with cores.
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
# `raw_value` lets hot paths re-emit untouched JSON subtrees verbatim instead of
# materializing them into `Value` trees (see `osproxy-rewrite::wrap_query`).
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", default-features = false }
# HTTP stack for upstream delivery and ingress. hyper-util's pooled client gives
# us TCP+TLS connection reuse (NFR-P) without hand-rolling a pool.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
# The `Service<Uri>` trait the pooled client's connector implements; we wrap it
# to count real TCP connection opens for pool-reuse telemetry (NFR-P).
tower-service = { version = "0.3", default-features = false }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
# The `osproxy` binary's global allocator. A modern sharded/arena allocator cuts
# malloc/free contention across worker threads on this allocation-heavy request
# path; it is orthogonal to the crypto provider, so it applies to default and FIPS
# builds alike. Linked only by the binary (osproxy-server), never the libraries.
mimalloc = { version = "0.1", default-features = false }
# etcd v3 client for the reference distributed `DirectiveStore` (osproxy-etcd).
# default-features off keeps its TLS feature out, so this control-plane adapter
# pulls no second crypto provider into a FIPS build (TLS-to-etcd is a documented
# opt-in over the operator's trusted control network).
etcd-client = { version = "0.19", default-features = false }
# Stream combinators for bounded-concurrency demux dispatch (buffer_unordered).
# Already in the tree via hyper-util; no runtime/spawn needed — just polling.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Bounded per-tenant metrics (osproxy-observe::TenantMetrics): a TTL + max-size
# evicting cache, so exported cardinality tracks live tenants, never all-time
# count. `sync` only, no async runtime coupling needed for a plain counter map.
moka = { version = "0.12", default-features = false, features = ["sync"] }
# Pure encoding, no I/O: osproxy-core's UpstreamCredentials::basic needs it
# for the Authorization: Basic <base64> wire form.
base64 = "0.22"
# Vectorized single-needle/substring byte search (cursor::has_scroll_id,
# NDJSON line framing in osproxy-engine/osproxy-rewrite): jumps over runs of
# ordinary bytes in one call instead of a per-byte bounds-checked loop. Pure
# computation, no I/O. Already in the tree transitively (serde_json, etc.).
memchr = "2"
# Portable safe SIMD for osproxy-core::json's zero-materialization scanner
# (ADR-014): finds the end of an ordinary string run (`"`, `\`, or a control
# byte) via a vectorized compare instead of a per-byte/per-word scan.
# `cfg`-dispatches to AVX2 (x86_64), NEON (aarch64), or a scalar fallback at
# compile time — no runtime feature detection, no `unsafe` in our code (the
# per-platform unsafe lives inside `wide`, same trust model as `memchr`).
# Pure computation, no I/O — fine in `core`.
wide = "1"
# TLS via rustls behind the CryptoProvider seam. The crypto *provider* is NOT
# pinned here — osproxy-transport selects it per build feature so a FIPS artifact
# links only aws-lc-rs and a dev build links only `ring` (ADR-009, docs/07):
# transport adds `tokio-rustls/ring` (non-fips) or `tokio-rustls/fips` (fips).
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
# Crypto modules used directly for the mTLS cert fingerprint (SHA-256). Optional +
# feature-selected in osproxy-transport; ring for non-fips, aws-lc-rs for fips
# (its `digest` API mirrors ring's). aws-lc-rs `fips` builds AWS-LC-FIPS (cmake).
ring = "0.17"
# `fips` is intentional: this dep exists ONLY to back the FIPS crypto provider, so
# it must stay a single-consumer dep (osproxy-transport, behind `dep:aws-lc-rs`).
# A future non-FIPS use of aws-lc-rs must not inherit the AWS-LC-FIPS C build.
#
# PINNED EXACTLY (docs/07 §2.1, docs/specs/fips-boundary.md): the crate version
# determines the linked AWS-LC-FIPS *module* version, which is a tracked
# compliance fact — never a routine `cargo update`. 1.17.0 binds AWS-LC-FIPS 3.0
# (CMVP review pending / MIP list). NOTE: the module line is COUPLED to rustls —
# rustls 0.23.40 requires aws-lc-rs >=1.14 (3.0); the validated 2.0 module
# (cert #4816) needs aws-lc-rs <1.12 and therefore an older rustls. Changing this
# pin is a compliance event: update the boundary doc in the same change.
aws-lc-rs = { version = "=1.17.0", features = ["fips"] }
rcgen = "0.13"
# Local-first wall-clock micro-benchmarks (`cargo xtask bench`). divan owns its
# own timing loop, so bench code needs no banned `Instant::now`. Wall-clock is
# noisy/host-specific, so these calibrate and explore locally — they are NOT a CI
# gate; the deterministic gates are dhat (alloc counts) and, in CI where valgrind
# exists, iai-callgrind (instruction counts). (docs/12)
divan = "0.1"
# gRPC ingress (docs/11 M4). tonic serves the proxy's DocumentService over h2;
# tonic-prost is the runtime prost codec, prost the message runtime, and
# tonic-prost-build the build-time codegen (needs `protoc`). tokio-stream adapts
# a bound TcpListener into tonic's incoming-connection stream.
tonic = { version = "0.14", default-features = false, features = ["server", "router", "transport", "codegen", "channel"] }
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
# CBOR (RFC 8949) for the async fan-out op-envelope body: a compact, portable
# binary encoding OpenSearch ingests natively (docs/04 §9, ADR-010).
ciborium = "0.2"
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
# Live integration tests against a real OpenSearch container (the M1 exit gate).
# Requires a running Docker daemon; the tests are #[ignore]'d so CI without
# Docker stays green.
testcontainers = "0.26"
# Kafka container for the fan-out round-trip test (docs/04 §9); #[ignore]'d.
# 0.14 pins testcontainers ^0.26, matching the workspace pin above.
testcontainers-modules = "0.14"
# Direct krafka consumer for that test, to read an op envelope back off the
# broker. The producer side already composes krafka via osproxy-kafka-krafka.
krafka = { version = "0.12", default-features = false }

# Lints applied to every crate that opts in via `[lints] workspace = true`.
# See docs/08-engineering-standards.md. xtask deliberately does NOT opt in.
[workspace.lints.rust]
# `deny`, not `forbid`: unsafe stays off by default everywhere, but `forbid`
# cannot be locally lifted at all, which made the "any exception requires a
# SAFETY proof and reviewer sign-off" policy below (docs/08 §5) impossible to
# actually use. `deny` keeps the default-closed posture while letting a single
# audited module opt back in with an explicit, visible `#[allow(unsafe_code)]`
# plus the hygiene lints below (see .agents/skills/rust-unsafe-optimization).
unsafe_code = "deny"
# Once a module does opt in, these hold it to the same discipline as `wide`/
# `memchr`'s own unsafe: no bare unsafe inside an unsafe fn's body without its
# own justification, and every unsafe block is documented and does one thing.
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Reliability: no panics reachable from library code (NFR-R1).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Unsafe hygiene (paired with unsafe_code = "deny" above): a documented
# `# Safety` section per unsafe fn, a `// SAFETY:` comment per unsafe block,
# and one operation per block so the comment maps to exactly the thing it
# justifies.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
# Structure / no-god-* budgets (docs/08). Soft (warn) so a `// JUSTIFY` review
# decision can keep them; CI greps for unjustified overflows separately.
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
# General quality.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
